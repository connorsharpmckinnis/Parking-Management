services:
  db:
    image: postgres:15-alpine
    container_name: parking-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: parking_db
    ports:
      - "5432:5432"
    volumes:
      - parking_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d parking_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - parking-net

  control-plane:
    build:
      context: .
      dockerfile: control_plane/Dockerfile
    container_name: parking-control-plane
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/parking_db
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - parking-net
    volumes:
      # --- DEV VOLUMES: Remove for production ---
      - ./control_plane:/app/control_plane
      - ./database:/app/database
      # ------------------------------------------

  ingest-service:
    build:
      context: ./ingest_service
      dockerfile: Dockerfile
    container_name: parking-ingest-service
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/parking_db
    ports:
      - "8003:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - parking-net
    volumes:
      # --- DEV VOLUMES: Remove for production ---
      - ./ingest_service:/app
      - ./database:/app/database
      # ------------------------------------------

  dashboard:
    build: ./dashboard
    container_name: parking-dashboard
    ports:
      - "8501:8501"
    environment:
      CONTROL_PLANE_URL: http://control-plane:8000
    depends_on:
      - control-plane
    restart: unless-stopped
    networks:
      - parking-net
    volumes:
      # --- DEV VOLUMES: Remove for production ---
      - ./dashboard:/app
      # ------------------------------------------

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: parking-orchestrator
    environment:
      CONTROL_PLANE_URL: http://control-plane:8000
      WORKER_IMAGE: parking-vision-worker:latest
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    volumes:
      # --- DEV VOLUMES: Remove for production ---
      - ./orchestrator:/app
      # ------------------------------------------
      # Access to Docker socket (Windows Docker Desktop usually puts it here or at //var/run/docker.sock)
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - control-plane
    restart: unless-stopped
    networks:
      - parking-net

  vision-worker:
    image: parking-vision-worker:latest
    build:
      context: ./vision_worker
      dockerfile: Dockerfile
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    networks:
      - parking-net

  mqtt-broker:
    build: ./mqtt_broker
    container_name: parking-mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    healthcheck:
      test: [ "CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - parking-net

  edge-simulator:
    build: ./edge_processing
    container_name: parking-edge-simulator
    environment:
      MQTT_BROKER: mqtt-broker
      UPDATE_INTERVAL: 15
    depends_on:
      mqtt-broker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - parking-net

  ingest-bridge:
    build: ./ingest_bridge
    container_name: parking-ingest-bridge
    environment:
      MQTT_BROKER: mqtt-broker
      INGEST_SERVICE_URL: http://ingest-service:8001
    depends_on:
      mqtt-broker:
        condition: service_healthy
      ingest-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - parking-net

networks:
  parking-net:
    driver: bridge

volumes:
  parking_data:
  mqtt_data:
  mqtt_log:
