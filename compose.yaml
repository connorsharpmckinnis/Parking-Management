services:
  db:
    image: postgres:15-alpine
    container_name: parking-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: parking_db
    ports:
      - "5432:5432"
    volumes:
      - parking_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d parking_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - parking-net

  control-plane:
    build:
      context: .
      dockerfile: control_plane/Dockerfile
    container_name: parking-control-plane
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/parking_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--output-document=/dev/null", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - parking-net
    volumes:
      - ./control_plane:/app/control_plane
      - ./database:/app/database

  ingest-service:
    build:
      context: .
      dockerfile: ingest_service/Dockerfile
    container_name: parking-ingest-service
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/parking_db
    ports:
      - "8003:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--output-document=/dev/null", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - parking-net
    volumes:
      - ./ingest_service:/app/ingest_service
      - ./database:/app/database

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: parking-dashboard
    ports:
      - "8501:8501"
    environment:
      CONTROL_PLANE_URL: http://control-plane:8000
    depends_on:
      - control-plane
    restart: unless-stopped
    networks:
      - parking-net
    volumes:
      - ./dashboard:/app

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: parking-orchestrator
    environment:
      CONTROL_PLANE_URL: http://control-plane:8000
      INGEST_SERVICE_URL: http://ingest-service:8001
      WORKER_IMAGE: peakpark-vision-worker:latest
      # --- DEV CONFIG ---
      FORCE_CPU: "true"
      DOCKER_NETWORK: parking-management_parking-net
      # This mount tells the orchestrator where the vision_worker code is on the HOST
      # so it can volume-mount it into the worker containers it starts.
      MOUNT_WORKER_CODE: ${PWD}/vision_worker
      # ------------------
    volumes:
      - ./orchestrator:/app/orchestrator
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - control-plane
      - ingest-service
    restart: unless-stopped
    networks:
      - parking-net

  vision-worker:
    # This service is primarily for building the image used by the orchestrator.
    # It does not need to run as a separate service.
    build:
      context: .
      dockerfile: vision_worker/Dockerfile
    image: peakpark-vision-worker:latest
    container_name: parking-vision-worker-builder
    command: [ "echo", "Vision worker image built!" ]
    networks:
      - parking-net
